<!DOCTYPE html>
<html class="light" lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Login')}"></head>
<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center">
<script id="tailwind-config">
  tailwind.config = { darkMode:"class", theme:{ extend:{ colors:{"primary":"#00478d","on-primary":"#ffffff","surface":"#f8f9fa","on-surface":"#191c1d","surface-container-lowest":"#ffffff","outline-variant":"#c2c6d4","primary-container":"#005eb8","on-primary-container":"#c8daff","secondary":"#575f67","on-surface-variant":"#424752","error":"#ba1a1a","on-error":"#ffffff"}, spacing:{"stack-md":"16px","stack-lg":"32px","gutter":"24px","unit":"8px"}, fontFamily:{"label-md":["Inter"],"body-md":["Inter"],"headline-md":["Inter"]} } } }
</script>
<div class="w-full max-w-md mx-auto p-gutter">
  <div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-stack-lg">
    <div class="text-center mb-stack-lg">
      <h1 class="font-headline-md text-headline-md font-bold text-primary">MediGuide</h1>
      <p class="text-secondary text-body-md mt-2">Masuk ke akun Anda</p>
    </div>

    <!-- Pesan error jika login gagal -->
    <div th:if="${param.error}" class="bg-error/10 border border-error/20 text-error rounded-lg p-stack-md mb-stack-md text-label-md">
      Email atau password salah.
    </div>
    <div th:if="${param.logout}" class="bg-green-50 border border-green-200 text-green-800 rounded-lg p-stack-md mb-stack-md text-label-md">
      Anda berhasil logout.
    </div>

    <!-- Form Login — action ditangani Spring Security -->
    <form th:action="@{/api/auth/login}" method="post" class="space-y-stack-md">
      <div>
        <label class="text-label-md text-on-surface-variant block mb-1">Email</label>
        <input type="email" name="username" required
          class="w-full h-12 px-4 rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all"
          placeholder="contoh@email.com">
      </div>
      <div>
        <label class="text-label-md text-on-surface-variant block mb-1">Password</label>
        <input type="password" name="password" required
          class="w-full h-12 px-4 rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all"
          placeholder="••••••••">
      </div>
      <button type="submit"
        class="w-full h-12 bg-primary text-on-primary font-bold rounded-lg hover:opacity-90 active:scale-95 transition-all">
        Masuk
      </button>
    </form>

    <p class="text-center text-label-md text-on-surface-variant mt-stack-md">
      Belum punya akun?
      <a href="/register" class="text-primary font-bold hover:underline">Daftar sekarang</a>
    </p>
  </div>
</div>
</body>
</html>
